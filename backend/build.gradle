plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.minokim'
version = '0.0.1-SNAPSHOT'
description = 'Lumia Island Wiki API'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform { excludeTags 'integration' }
}

tasks.register('integrationTest', Test) {
    description = 'Runs isolated PostgreSQL integration tests (requires Docker).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'integration' }
    shouldRunAfter tasks.named('test')
}

tasks.named('check') { dependsOn tasks.named('integrationTest') }

// Evidence executions must produce fresh reports instead of reusing cached results.
tasks.withType(Test).configureEach {
    maxHeapSize = '256m'
    maxParallelForks = 1
    if (providers.gradleProperty('tddReportDir').isPresent()) {
        reports.junitXml.outputLocation = file("${providers.gradleProperty('tddReportDir').get()}/${name}")
        outputs.upToDateWhen { false }
        outputs.cacheIf { false }
    }
}

// Shared SQL source; packaged resources are generated output.
tasks.named('processResources') {
    from(rootProject.file('../db/migration')) {
        include '**/*.sql'
        into 'db/migration'
    }
}
