server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_APP_USERNAME}
    password: ${DB_APP_PASSWORD}
  flyway:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: ${DB_FLYWAY_USERNAME}
    password: ${DB_FLYWAY_PASSWORD}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
logging:
  level:
    io.github.minokim.lumiawiki: INFO
