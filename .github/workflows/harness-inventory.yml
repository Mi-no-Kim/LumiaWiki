name: Harness inventory

"on":
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Inventory (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.agents/skills/
            /.codex/
            /.github/workflows/harness-inventory.yml
            /scripts/
            /harness/
            /docs/
            /work/
            /AGENTS.md
            /README.md
            /STRUCTURE.md
            /.gitignore
            !/harness-design/
            !/.harness-state/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Check exact committed inventory
        run: python -B -X utf8 scripts/check-harness-inventory.py --candidate HEAD
      - name: Check incoming messages and PR text
        shell: python
        run: |
          import os
          import subprocess
          import sys
          subprocess.run([sys.executable, '-B', '-X', 'utf8', 'scripts/check-github-closing.py',
                          '--event-file', os.environ['GITHUB_EVENT_PATH'],
                          '--event-name', os.environ['GITHUB_EVENT_NAME']], check=True)
      - name: Prepare parent document blobs
        env:
          PARENT_BLOB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os
          from pathlib import PurePosixPath
          import subprocess
          from urllib.request import Request, urlopen
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs)
          parents = git('rev-list', '--parents', '-n', '1', 'HEAD').decode().split()
          if len(parents) > 1:
              base = parents[1]
              paths = git('diff', '--name-only', '-z', '--diff-filter=AM', '--no-renames', base, 'HEAD', '--',
                          'AGENTS.md', 'README.md', 'STRUCTURE.md', 'docs', 'harness', 'work').decode().split('\0')
              paths = [path for path in paths if path and PurePosixPath(path).suffix in ('.md', '.json', '.yaml', '.yml', '.toml')
                       and not ('/artifacts/' in path and not path.endswith('.md'))]
              if paths:
                  rows = git('ls-tree', '-r', '-z', base, '--', *paths).split(b'\0')
                  entries = [row.split(b'\t', 1)[0].split() for row in rows if row]
                  objects = sorted({entry[2] for entry in entries if entry[1] == b'blob'})
                  if objects:
                      checked = git('cat-file', '--batch-check', input=b'\n'.join(objects) + b'\n',
                                    env={**os.environ, 'GIT_NO_LAZY_FETCH': '1'})
                      missing = [line.split()[0].decode() for line in checked.splitlines() if line.endswith(b' missing')]
                      for oid in missing:
                          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{oid}"
                          request = Request(url, headers={'Accept': 'application/vnd.github.raw+json'})
                          request.add_unredirected_header('Authorization', f"Bearer {os.environ['PARENT_BLOB_TOKEN']}")
                          with urlopen(request, timeout=30) as response:
                              blob = response.read(20_000_001)
                          if len(blob) > 20_000_000 or git('hash-object', '--stdin', input=blob).decode().strip() != oid:
                              raise ValueError(f'Invalid parent document blob: {oid}')
                          git('hash-object', '-w', '--stdin', input=blob)
      - name: Check changed work records
        run: python -B -X utf8 scripts/check-work-records.py --candidate HEAD
      - name: Candidate and hook behavior
        run: python -B -X utf8 -m unittest discover -s scripts/tests -v
      - name: Existing review tool regression
        run: python -B -X utf8 -m unittest discover -s .agents/skills/review-work/scripts -p "test_*.py" -v
