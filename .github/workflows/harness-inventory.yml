name: Harness inventory

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Inventory (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.agents/skills/
            /.codex/
            /.github/workflows/harness-inventory.yml
            /scripts/
            /harness/
            /docs/
            /work/
            /AGENTS.md
            /README.md
            /STRUCTURE.md
            /.gitignore
            /package.json
            /package-lock.json
            /.prettierrc.json
            /backend/build.gradle
            /backend/settings.gradle
            /backend/gradlew
            /backend/gradlew.bat
            /backend/gradle/wrapper/
            !/harness-design/
            !/.harness-state/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.2'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check exact committed inventory
        run: python -B -X utf8 scripts/check-harness-inventory.py --candidate HEAD
      - name: Prepare parent document blobs
        run: python -B -X utf8 scripts/quality/record-base.py
      - name: Check changed work records
        run: python -B -X utf8 scripts/check-work-records.py --candidate HEAD
      - name: Candidate and hook behavior
        run: python -B -X utf8 -m unittest discover -s scripts/tests -v
      - name: Existing review tool regression
        run: python -B -X utf8 -m unittest discover -s .agents/skills/review-work/scripts -p "test_*.py" -v
