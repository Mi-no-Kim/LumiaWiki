name: Harness inventory

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Inventory (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.agents/skills/
            /.codex/
            /.github/workflows/harness-inventory.yml
            /scripts/
            /harness/
            /docs/
            /work/
            /AGENTS.md
            /README.md
            /STRUCTURE.md
            /.gitignore
            !/harness-design/
            !/.harness-state/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Check exact committed inventory
        run: python -B -X utf8 scripts/check-harness-inventory.py --candidate HEAD
      - name: Prepare parent document blobs
        shell: python
        run: |
          import os
          from pathlib import PurePosixPath
          import subprocess
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs)
          parents = git('rev-list', '--parents', '-n', '1', 'HEAD').decode().split()
          if len(parents) > 1:
              base = parents[1]
              paths = git('diff', '--name-only', '-z', '--diff-filter=AM', '--no-renames', base, 'HEAD', '--',
                          'AGENTS.md', 'README.md', 'STRUCTURE.md', 'docs', 'harness', 'work').decode().split('\0')
              paths = [path for path in paths if path and PurePosixPath(path).suffix in ('.md', '.json', '.yaml', '.yml', '.toml')
                       and not ('/artifacts/' in path and not path.endswith('.md'))]
              if paths:
                  rows = git('ls-tree', '-r', '-z', base, '--', *paths).split(b'\0')
                  objects = sorted({row.split(b'\t', 1)[0].split()[2] for row in rows if row})
                  if objects:
                      checked = git('cat-file', '--batch-check', input=b'\n'.join(objects) + b'\n',
                                    env={**os.environ, 'GIT_NO_LAZY_FETCH': '1'})
                      missing = [line.split()[0].decode() for line in checked.splitlines() if line.endswith(b' missing')]
                      if missing:
                          subprocess.run(['git', 'fetch', '--no-tags', '--no-write-fetch-head',
                                          '--filter=blob:none', 'origin', *missing], check=True)
      - name: Check changed work records
        run: python -B -X utf8 scripts/check-work-records.py --candidate HEAD
      - name: Candidate and hook behavior
        run: python -B -X utf8 -m unittest discover -s scripts/tests -v
      - name: Existing review tool regression
        run: python -B -X utf8 -m unittest discover -s .agents/skills/review-work/scripts -p "test_*.py" -v
